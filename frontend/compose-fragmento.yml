# Al final del servicio reservas (después de su depends_on):
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      # nginx reenvía /v1 a Reservas: se espera a que la API responda, para no dar 502 al arrancar
      reservas:
        condition: service_healthy
