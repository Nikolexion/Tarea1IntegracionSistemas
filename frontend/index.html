<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>CoLabora</title>
</head>
<body>
  <h1>CoLabora</h1>

  <!-- Mensajes y errores (title y detail del Problem Details) -->
  <p id="mensajes"></p>

  <!-- Sin sesión: iniciar sesión o registrarse -->
  <section id="seccion-acceso">
    <h2>Iniciar sesión</h2>
    <form id="form-login">
      <label>Email <input type="email" name="email" required></label>
      <label>Contraseña <input type="password" name="password" required></label>
      <button type="submit">Entrar</button>
    </form>

    <h2>Registrarse</h2>
    <form id="form-registro">
      <label>Nombre <input type="text" name="nombre" required></label>
      <label>Email <input type="email" name="email" required></label>
      <label>Contraseña <input type="password" name="password" required></label>
      <button type="submit">Crear cuenta</button>
    </form>
  </section>

  <!-- Con sesión -->
  <section id="seccion-sesion" hidden>
    <h2>Sesión</h2>
    <p>Nombre: <span id="sesion-nombre"></span> · Rol: <span id="sesion-rol"></span></p>
    <button id="boton-salir">Cerrar sesión</button>

    <h2>Disponibilidad</h2>
    <label>Fecha <input type="date" id="fecha"></label>
    <button id="boton-grilla">Ver grilla</button>
    <p id="filtro-salas"></p>
    <table border="1">
      <thead>
        <tr><th>Sala</th><th>Franja</th><th>Puestos libres</th><th></th></tr>
      </thead>
      <tbody id="tabla-grilla"></tbody>
    </table>

    <h2 id="titulo-reservas">Mis reservas</h2>
    <button id="boton-reservas">Actualizar</button>
    <table border="1">
      <thead>
        <tr><th>Id</th><th>Sala</th><th>Fecha</th><th>Franja</th><th>Estado</th><th></th></tr>
      </thead>
      <tbody id="tabla-reservas"></tbody>
    </table>
    <button id="mas-reservas" hidden>Ver más</button>

    <!-- Solo para administradores -->
    <section id="seccion-usuarios" hidden>
      <h2>Usuarios</h2>
      <button id="boton-usuarios">Actualizar</button>
      <table border="1">
        <thead>
          <tr><th>Id</th><th>Nombre</th><th>Email</th><th>Rol</th></tr>
        </thead>
        <tbody id="tabla-usuarios"></tbody>
      </table>
      <button id="mas-usuarios" hidden>Ver más</button>
    </section>
  </section>

  <script src="app.js"></script>
</body>
</html>
