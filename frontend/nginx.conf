# Sirve el frontend y reenvía la API a Reservas.
# Un solo origen para el navegador: no hace falta CORS.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Solo /v1 llega a Reservas; el resto de rutas no sale del frontend
    location /v1/ {
        proxy_pass http://reservas:8000;
        # Conserva host y puerto que ve el navegador (por ejemplo, en el header Location)
        proxy_set_header Host $http_host;
    }
}
